[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Fork tests resolve protocol addresses from the pinned manifest, never from literals.
fs_permissions = [{ access = "read", path = "../../deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50
fail_on_revert = true
